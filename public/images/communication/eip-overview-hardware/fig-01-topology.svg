<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" width="560" height="578" role="img" aria-label="EtherNet/IP 接线：PLC、工业交换机与多台读码器">
  <style>
    .box { fill: #f7f9fc; stroke: #cbd8e6; stroke-width: 1.5; }
    .box-alt { fill: #eef4fb; stroke: #b7cce4; stroke-width: 1.5; }
    .t { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #122238; text-anchor: middle; }
    .t-sm { font-size: 12.5px; fill: #40566d; }
    .t-md { font-size: 14px; fill: #28425f; }
    .t-lg { font-size: 16px; font-weight: 700; }
    .wire { stroke: #8aa8c6; stroke-width: 1.5; fill: none; }
    .note { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12.5px; fill: #546a80; text-anchor: middle; }
  </style>

  <rect class="box" x="24" y="12" width="272" height="58" rx="4"/>
  <text class="t t-lg" x="160" y="36">PLC</text>
  <text class="t t-md" x="160" y="56">欧姆龙 NX102-9000</text>

  <path class="wire" d="M160 70 V 104"/>
  <path class="wire" d="M154 97 L160 104 L166 97"/>
  <text class="t t-sm" x="168" y="92" text-anchor="start">EtherNet/IP · 同网段</text>

  <rect class="box" x="80" y="104" width="160" height="40" rx="4"/>
  <text class="t t-lg" x="160" y="130">工业交换机</text>

  <path class="wire" d="M160 144 V 160"/>
  <path class="wire" d="M52 160 H 268"/>
  <path class="wire" d="M52 160 V 190"/>
  <path class="wire" d="M160 160 V 190"/>
  <path class="wire" d="M268 160 V 190"/>

  <rect class="box-alt" x="6" y="190" width="92" height="48" rx="4"/>
  <text class="t t-md" x="52" y="212">读码器 1</text>
  <text class="t t-sm" x="52" y="229">ID 系列</text>

  <rect class="box-alt" x="114" y="190" width="92" height="48" rx="4"/>
  <text class="t t-md" x="160" y="212">读码器 2</text>
  <text class="t t-sm" x="160" y="229">ID 系列</text>

  <rect class="box-alt" x="222" y="190" width="92" height="48" rx="4"/>
  <text class="t t-md" x="268" y="212">读码器 3</text>
  <text class="t t-sm" x="268" y="229">ID 系列</text>

  <text class="note" x="160" y="268">相机与 PLC 必须在同一网段，能互相 ping 通</text>
  <text class="note" x="160" y="292">只有一台相机时，可省掉交换机，</text>
  <text class="note" x="160" y="312">直接把网线插到 PLC 的 EtherNet/IP 网口</text>
</svg>
